<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f2a5f">
<title>Saldo — Art House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --white:#fff; --ink:#0b1f44; --ink2:#3a4b70; --muted:#78879f; --hair:rgba(11,31,68,.08); --hair2:rgba(11,31,68,.14);
  --navy:#0f2a5f; --navy2:#1c3f8c; --blue:#3b6cf0; --tint:#f5f8ff; --tint2:#eaf0fd;
  --pos:#0c9a68; --pos-t:#e3f6ee; --neg:#d8453b; --neg-t:#fdecea; --warn:#b26a00; --warn-t:#fff3d9;
  --shadow:0 1px 2px rgba(11,31,68,.04),0 6px 20px rgba(11,31,68,.05);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --font:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--white);color:var(--ink);font:400 15px/1.5 var(--font);font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)} .s{font-size:13px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* ---------- header: translucent navy material, sticky ---------- */
.hdr{position:sticky;top:0;z-index:30;background:rgba(15,42,95,.9);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);color:#fff}
.hdr .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:17px;letter-spacing:-.02em}
.brand i{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--navy);font-style:normal;font-size:15px;font-weight:800}
.tabs{position:relative;display:flex;background:rgba(255,255,255,.12);border-radius:11px;padding:3px}
.tabs .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;background:#fff;border-radius:8px;transition:transform 260ms var(--ease-out),width 260ms var(--ease-out);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tab{position:relative;z-index:1;border:0;background:none;padding:6px 16px;border-radius:8px;color:rgba(255,255,255,.82);font-weight:500;font-size:14px;transition:color 160ms ease-out,transform 160ms ease-out}
.tab[aria-selected=true]{color:var(--navy);font-weight:600}
.tab:active{transform:scale(.97)}
.sp{flex:1}
.hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:5px 12px;font-size:13px;font-weight:500;transition:transform 160ms ease-out,background 160ms ease-out}
.hbtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.hbtn:hover{background:rgba(255,255,255,.18)}}
.alert{display:flex;align-items:center;gap:7px;border:0;background:#ffd98a;color:#5b3600;border-radius:99px;padding:5px 12px 5px 9px;font-size:13px;font-weight:650;transition:transform 160ms ease-out}
.alert:active{transform:scale(.97)}
.alert b{background:#5b3600;color:#ffd98a;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px;padding:0 5px}
.stamp{font-size:12px;color:rgba(255,255,255,.62)}

/* ---------- hero band ---------- */
.band{background:linear-gradient(165deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:14px 0 34px}
.band .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:end}
.lbl{font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.band .lbl{color:rgba(255,255,255,.66)}
.big{font-size:clamp(40px,7vw,68px);font-weight:700;letter-spacing:-.04em;line-height:1.02;margin:6px 0 6px}
.cash{color:rgba(255,255,255,.8);font-size:15px}
.cash b{color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.chip{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 13px;font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.3}
.chip b{display:block;font-size:18px;font-weight:650;color:#fff;letter-spacing:-.02em}
.op{color:rgba(255,255,255,.5);font-size:18px}
.miniw{min-width:0}
.miniw .cap{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.66);margin-bottom:4px}
@media (max-width:860px){.band .wrap{grid-template-columns:minmax(0,1fr)}}
.band .wrap>*{min-width:0}

/* ---------- content ---------- */
main{padding-bottom:72px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:22px;padding-bottom:6px}
.pull{position:relative;z-index:2}
.seg{display:inline-flex;background:var(--tint2);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2);transition:background 160ms ease-out,color 160ms ease-out,transform 160ms ease-out}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);font-weight:650;box-shadow:0 1px 4px rgba(11,31,68,.16)}
.field{border:1px solid var(--hair2);background:#fff;border-radius:11px;padding:8px 12px;font-size:14px;min-width:0}
input.field{width:200px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:16px}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:20px;min-width:0}
.card{background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow);padding:22px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.015em}
.card .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.tot{font-weight:700;font-size:20px;letter-spacing:-.025em;text-align:right;line-height:1.15}
.tot small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}

/* list rows */
.rows{display:grid;gap:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 8px;margin:0 -8px;border-radius:12px;cursor:pointer;text-align:left;border:0;background:none;width:calc(100% + 16px);transition:background 140ms ease-out}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--tint)}}
.row:active{background:var(--tint2)}
.row .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.row .m{color:var(--muted);font-size:12.5px}
.row .bar{grid-column:1/-1;height:5px;border-radius:99px;background:var(--tint2);margin-top:5px;overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:fill 520ms var(--ease-out) both}
@keyframes fill{from{transform:scaleX(.05)}}
.more{overflow:hidden;display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--ease-out)}
.more>div{min-height:0}
.more.open{grid-template-rows:1fr}
.tgl{border:0;background:none;color:var(--blue);font-weight:600;font-size:14px;padding:10px 0 0;transition:transform 160ms ease-out}
.tgl:active{transform:scale(.97)}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.b-blue{background:var(--tint2);color:var(--blue)} .b-warn{background:var(--warn-t);color:var(--warn)}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}

/* spend card */
.kpi{font-size:clamp(30px,5vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.08;margin-top:6px}
.delta{font-size:13px;color:var(--muted);margin-top:4px}
.delta b{color:var(--ink2);font-weight:600}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--tint2);margin:14px 0 10px}
.split i{display:block;height:100%;transition:width 400ms var(--ease-out)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.leg b{font-weight:650}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 11px var(--font);fill:var(--muted)}
.guide{stroke:var(--hair2);stroke-width:1;opacity:0;transition:opacity 120ms ease-out}
.dot{opacity:0;transition:opacity 120ms ease-out}
.hv .col{opacity:.3;transition:opacity 120ms ease-out}
.hv .col.on{opacity:1}
.col rect{transform-box:fill-box;transform-origin:bottom;animation:grow 420ms var(--ease-out) both;animation-delay:calc(var(--k,0)*12ms)}
@keyframes grow{from{transform:scaleY(.3);opacity:0}}
.ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 720ms var(--ease-out) both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.6);opacity:0}}
#tip{position:fixed;z-index:80;pointer-events:none;background:rgba(11,31,68,.95);color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(11,31,68,.28);opacity:0;transform:scale(.97);transition:opacity 110ms ease-out,transform 110ms ease-out;max-width:270px}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:600} #tip .r{display:flex;justify-content:space-between;gap:14px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}

/* foremen grid + objects table */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:18px}
.fc{cursor:pointer;text-align:left;transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.fc:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.fc:hover{box-shadow:0 2px 4px rgba(11,31,68,.05),0 14px 32px rgba(11,31,68,.10)}}
.fc .nm{font-weight:650;font-size:17px;letter-spacing:-.02em}
.fc .val{font-size:30px;font-weight:700;letter-spacing:-.035em;margin:12px 0 2px;line-height:1.1}
.fc .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.fc .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.fc .foot b{color:var(--ink);font-weight:650}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--hair);white-space:nowrap;background:#fff;position:sticky;top:0}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.sort{cursor:pointer;user-select:none} .tbl th.sort:hover{color:var(--ink)}
.tbl td{padding:12px;border-bottom:1px solid var(--hair);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer;transition:background 140ms ease-out}
@media (hover:hover) and (pointer:fine){.tbl tbody tr:hover{background:var(--tint)}}
.tbl tr:last-child td{border-bottom:0}
.nm2{font-weight:600}
.mbar{height:6px;border-radius:99px;background:var(--tint2);position:relative;min-width:90px}
.mbar i{position:absolute;top:0;bottom:0;border-radius:99px}
.scroll{overflow:auto;max-width:100%}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(11,31,68,.32);opacity:0;pointer-events:none;transition:opacity 220ms ease-out;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:transform 320ms var(--ease-drawer);overflow:auto;box-shadow:-18px 0 50px rgba(11,31,68,.18)}
.drawer.on{transform:none}
.dh{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.88);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);padding:20px 24px 14px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--hair)}
.dh h2{margin:0;font-size:24px;letter-spacing:-.03em}
.db{padding:20px 24px 40px;display:grid;gap:26px}
.db h4{margin:0 0 10px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.x{flex:none;border:0;background:var(--tint2);width:34px;height:34px;border-radius:99px;font-size:15px;color:var(--ink2);transition:transform 160ms ease-out}
.x:active{transform:scale(.94)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv>div{background:var(--tint);border-radius:14px;padding:14px 16px}
.kv .v{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.ck{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair)}
.ck:last-child{border-bottom:0}
.ck i{flex:none;width:8px;height:8px;border-radius:99px;margin-top:8px;background:#f5b342}
.ck.i i{background:var(--blue)}
.ck p{margin:0;font-size:14px}
.lock{max-width:440px;margin:14vh auto;text-align:center;padding:0 24px}
.lock h1{font-size:28px;letter-spacing:-.03em;margin:16px 0 8px}
.skel{height:180px;background:linear-gradient(90deg,#eef2fb 25%,#f8faff 50%,#eef2fb 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.view.on .in{animation:rise 340ms var(--ease-out) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){.wrap{padding:0 16px}.chips{gap:6px}.chip{padding:7px 10px}.chip b{font-size:16px}.toolbar .field{flex:1 1 140px}.hdr .stamp{display:none}input.field{width:100%}.tab{padding:6px 12px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .drawer{transition:opacity 150ms ease}.drawer:not(.on){opacity:0}
}
@media (prefers-reduced-transparency:reduce){.hdr{background:var(--navy);backdrop-filter:none}.dh{background:#fff;backdrop-filter:none}}
</style>
</head>

<div id="tip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>

// smooth path through the points; control points are clamped so the curve never overshoots the data
function smooth(P) {
  if (P.length < 3) return P.map((p,i) => `${i?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for (let i=0;i<P.length-1;i++) { const p0 = P[i-1]||P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2]||p2;

    d += ` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${cl(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${cl(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
  return d;
}

  const t = T(), d = S.data, sp = span(), q = S.q.trim().toLowerCase();
  const spentBy = {}; d.expenses.filter(e => inR(e.d,sp.from,sp.to)).forEach(e => spentBy[e.p] = (spentBy[e.p]||0) + e.t);
  let rows = d.objects.filter(o => (!q || o.name.toLowerCase().includes(q)) && (S.side==="minus" ? o.kassa<0 : S.side==="plus" ? o.kassa>0 : true)).map(o => ({...o, spent:spentBy[o.name]||0}));
  const k = S.sortKey; rows.sort((a,b) => (typeof a[k]==="string" ? (a[k]||"").localeCompare(b[k]||"") : a[k]-b[k]) * S.sortDir);
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.kassa)), 1);
  const th = (key,label,r) => `<th class="sort ${r?"r":""}" data-sort="${key}">${label}${S.sortKey===key ? (S.sortDir>0?" ↑":" ↓") : ""}</th>`;
  return `<div class="wrap"><div class="toolbar">${perSeg()}<div class="seg" id="sideSeg">${["all","minus","plus"].map(x => `<button data-side="${x}" aria-pressed="${S.side===x}">${x==="all"?t.all:x==="minus"?t.minus:t.plus}</button>`).join("")}</div><input class="field" id="q" type="search" placeholder="${t.search}" value="${esc(S.q)}"></div>
   <section class="card in" style="padding:8px 10px;margin-top:14px"><div class="scroll"><table class="tbl"><thead><tr>${th("name",t.obj)}${th("foreman",t.foreman)}${th("kassa",t.kassa,1)}<th style="width:150px"></th>${th("income",t.income,1)}${th("expense",t.expense,1)}${th("spent",t.p[S.per],1)}</tr></thead>
   <tbody>${rows.map(o => `<tr data-object="${esc(o.name)}"><td class="nm2">${esc(o.name)}${o.status!=="active" ? ` <span class="badge b-warn">${esc(o.status)}</span>` : ""}</td><td class="mut">${o.foreman ? esc(o.foreman) : "—"}</td><td class="r ${cls(o.kassa)}"><b>${fmt(o.kassa)}</b></td>
     <td><div class="mbar"><i style="${o.kassa<0?"right":"left"}:50%;width:${(Math.abs(o.kassa)/maxAbs*50).toFixed(1)}%;background:${o.kassa<0?"var(--neg)":"var(--pos)"}"></i><i style="left:50%;width:1px;background:var(--hair2)"></i></div></td>
     <td class="r">${fmt(o.income)}</td><td class="r">${fmt(o.expense)}</td><td class="r"><b>${o.spent ? fmt(o.spent) : "·"}</b></td></tr>`).join("") || `<tr><td colspan="7" class="empty">${t.none}</td></tr>`}</tbody></table></div></section></div>`;
}

/* ------------------------------------------------ drawer */
const drawer = $("#drawer"), scrim = $("#scrim"); let lastFocus = null;
function openDrawer(html, after) { lastFocus = document.activeElement; drawer.innerHTML = html; drawer.classList.add("on"); scrim.classList.add("on"); drawer.setAttribute("aria-hidden","false"); drawer.scrollTop = 0;
  $(".x", drawer).addEventListener("click", closeDrawer); $(".x", drawer).focus({preventScroll:true}); if (after) after(); }
function closeDrawer() { drawer.classList.remove("on"); scrim.classList.remove("on"); drawer.setAttribute("aria-hidden","true"); hideTip(); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener("click", closeDrawer);
addEventListener("keydown", e => { if (e.key==="Escape" && drawer.classList.contains("on")) closeDrawer();
  if ((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("[data-foreman]:not(button)")) { e.preventDefault(); drawerForeman(e.target.dataset.foreman); } });
const dhead = (title, sub) => `<div class="dh"><div><h2>${esc(title)}</h2>${sub ? `<div class="mut s">${sub}</div>` : ""}</div><button class="x" aria-label="Close">✕</button></div>`;
const kv = (l,v,c) => `<div><div class="lbl">${l}</div><div class="v ${c||""}">${v}</div></div>`;

function drawerForeman(name) {
  const t = T(), d = S.data, f = d.foremen.find(x => x.name===name); if (!f) return;
  const sp = span(), days14 = dayList(addDays(d.today,-13), d.today);
  const rows = d.expenses.filter(e => e.f===name && inR(e.d,sp.from,sp.to)), tot = sum(rows, r => r.t);
  const byObj = {}; rows.forEach(r => byObj[r.p] = (byObj[r.p]||0) + r.t); const list = Object.entries(byObj).sort((a,b) => b[1]-a[1]);
  const dayTot = {}; d.expenses.filter(e => e.f===name).forEach(e => dayTot[e.d] = (dayTot[e.d]||0) + e.t);
  openDrawer(dhead(name, f.at ? `${t.last}: ${dl(f.at.slice(0,10))} · ${f.source==="auto"?t.auto:t.manual}` : t.noRep) + `<div class="db">
    <div class="kv">${kv(t.kassa, f.kassa===null?"—":fmt(f.kassa), cls(f.kassa||0))}${kv(t.spent+" · "+t.p[S.per], fmtS(tot))}</div>
    <div><h4>${t.hist}</h4><div class="chart" id="dHist"></div></div>
    <div><h4>${t.days}</h4><div class="chart" id="dDaily"></div></div>
    <div><h4>${t.byObj} · ${t.p[S.per]}</h4>${list.length ? `<div class="rows">${list.map(([n,v]) => `<button class="row" data-object="${esc(n)}"><span class="n">${esc(n)}</span><span class="a">${fmt(v)}</span><span class="m">${Math.round(v/tot*100)}%</span><span></span></button>`).join("")}</div>` : `<div class="empty">${t.noSpend}</div>`}</div>
    <div><h4>${t.day}</h4><table class="tbl"><tbody>${days14.slice().reverse().map(day => `<tr style="cursor:default"><td>${dl(day)}</td><td class="r"><b>${dayTot[day] ? fmt(dayTot[day]) : "·"}</b></td></tr>`).join("")}</tbody></table></div>
  </div>`, () => {
    lineChart($("#dHist"), f.history.map(h => ({x:h.d, v:h.kassa})), { name:t.kassa, h:190 });
    barChart($("#dDaily"), days14, [name], day => dayTot[day]||0, { h:180 });
  });
}
function drawerObject(name) {
  const t = T(), d = S.data, o = d.objects.find(x => x.name===name); if (!o) return;
  const days = dayList(addDays(d.today,-29), d.today), rows = d.expenses.filter(e => e.p===name && e.d>=days[0]);
  const byF = {}; rows.forEach(r => byF[grp(r.f)] = (byF[grp(r.f)]||0) + r.t); const m = {}; rows.forEach(r => m[r.d+"|"+grp(r.f)] = (m[r.d+"|"+grp(r.f)]||0) + r.t);
  const incs = d.income.filter(i => i.p===name && i.d>=days[0]).sort((a,b) => b.d.localeCompare(a.d));
  openDrawer(dhead(name, o.foreman ? `${t.foreman}: ${esc(o.foreman)}` : "") + `<div class="db">
    <div class="kv">${kv(t.kassa, fmt(o.kassa), cls(o.kassa))}${kv(t.income, fmtS(o.income))}${kv(t.expense, fmtS(o.expense))}</div>
    <div><h4>${t.dyn} · 30</h4><div class="chart" id="dDaily"></div>${legend(Object.keys(byF))}</div>
    <div><h4>${t.incomes}</h4>${incs.length ? `<table class="tbl"><tbody>${incs.map(i => `<tr style="cursor:default"><td>${dl(i.d)}</td><td class="r pos"><b>+${fmt(i.t)}</b></td></tr>`).join("")}</tbody></table>` : `<div class="empty">${t.none}</div>`}</div>
  </div>`, () => barChart($("#dDaily"), days, Object.keys(byF), (day,s) => m[day+"|"+s]||0, { h:180 }));
}
function drawerChecks() {
  const t = T(), cs = S.data.checks, fx = c => { let x = {}; try { x = JSON.parse(c.detail); } catch {} for (const k in x) if (typeof x[k]==="number" && !["days","count"].includes(k)) x[k] = fmt(x[k]); return (t.ck[c.kind]||(()=>c.title))(c.date?dl(c.date):"", c.foreman||"", x); };
  const G = [[t.g1, c => c.kind==="recon" && c.level==="warn", "w"], [t.g2, c => c.kind==="arith" && c.level==="warn", "w"], [t.g3, c => ["stale","noreport","unparsed"].includes(c.kind), "w"], [t.g4, () => true, "i"]];
  const used = new Set(); const body = G.map(([title,test,lv]) => { const l = cs.filter(c => !used.has(c) && test(c)).sort((a,b) => (b.date||"").localeCompare(a.date||"")); l.forEach(c => used.add(c));
    return l.length ? `<div><h4>${title} <span class="mut" style="font-weight:400">· ${l.length}</span></h4>${l.map(c => `<div class="ck ${lv==="i"?"i":""}"><i></i><p>${esc(fx(c))}</p></div>`).join("")}</div>` : ""; }).join("");
  openDrawer(dhead(t.attnT, "") + `<div class="db">${body || `<div class="empty">✓ ${t.attnOk}</div>`}</div>`);
}
const warnCount = () => S.data.checks.filter(c => c.level==="warn").length;

/* ------------------------------------------------ shell */
const VIEWS = [viewSummary, viewForemen, viewObjects];
function shell() {
  const t = T(), d = S.data, wc = warnCount();
  $("#app").innerHTML = `
  <header class="hdr"><div class="wrap">
    <div class="brand"><i>S</i>Saldo</div>
    <nav class="tabs" role="tablist"><span class="thumb" id="thumb"></span>${t.tabs.map((n,i) => `<button class="tab" role="tab" aria-selected="${i===S.tab}" data-tab="${i}">${n}</button>`).join("")}</nav>
    <span class="sp"></span>
    ${wc ? `<button class="alert" id="attn" title="${t.attnT}"><b>${wc}</b>${t.attn}</button>` : ""}
    <span class="stamp">${t.updated}: ${new Date(d.generatedAt).toLocaleTimeString(S.lang==="ru"?"ru-RU":"uz-UZ",{hour:"2-digit",minute:"2-digit"})}</span>
    <button class="hbtn" id="lang">${S.lang==="uz"?"RU":"UZ"}</button><button class="hbtn" id="refresh">${t.refresh}</button>
  </div></header>
  <div id="band"></div><main id="main"></main>`;
  render(); place();
}
function render() {
  $("#band").innerHTML = S.tab===0 ? bandHTML() : "";
  $("#main").innerHTML = `<div class="view on">${VIEWS[S.tab]()}</div>`;
  charts.forEach(c => c.isConnected || charts.delete(c));
  if (S.tab===0) afterSummary();
}
function place() { const b = $(`.tab[data-tab="${S.tab}"]`), th = $("#thumb"); if (b && th) { th.style.width = b.offsetWidth+"px"; th.style.transform = `translateX(${b.offsetLeft}px)`; } }
function go(i) { S.tab = i; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", +b.dataset.tab===i)); hideTip(); render(); place(); scrollTo({top:0}); }

document.addEventListener("click", e => {
  const c = sel => e.target.closest(sel);
  if (c("[data-tab]")) return go(+c("[data-tab]").dataset.tab);
  if (c("[data-per]")) { S.per = c("[data-per]").dataset.per; S.perChosen = true; S.autoNote = false; return render(); }
  if (c("[data-side]")) { S.side = c("[data-side]").dataset.side; return render(); }
  if (c("[data-sort]")) { const k = c("[data-sort]").dataset.sort; S.sortDir = S.sortKey===k ? -S.sortDir : 1; S.sortKey = k; return render(); }
  if (c("[data-more]")) { const b = c("[data-more]"), k = b.dataset.more; S.open[k] = !S.open[k]; $("#more-"+k).classList.toggle("open", S.open[k]); b.textContent = S.open[k] ? T().less : `${T().all} (${b.dataset.n})`; return; }
  if (c("[data-foreman]")) return drawerForeman(c("[data-foreman]").dataset.foreman);
  if (c("[data-object]")) return drawerObject(c("[data-object]").dataset.object);
  if (c("#attn")) return drawerChecks();
  if (c("#lang")) { S.lang = S.lang==="uz" ? "ru" : "uz"; try { localStorage.setItem("saldo.lang", S.lang); } catch {} document.documentElement.lang = S.lang; return shell(); }
  if (c("#refresh")) return load();
});
document.addEventListener("change", e => { if (e.target.id==="selF") { S.foreman = e.target.value; render(); } });
document.addEventListener("input", e => { if (e.target.id==="q") { S.q = e.target.value; const p = e.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(p,p); } } });

/* ------------------------------------------------ data */
function lockScreen(msg, sub, retry) { $("#app").innerHTML = `<div class="lock"><div class="brand" style="justify-content:center;color:var(--navy)"><i style="background:var(--navy);color:#fff">S</i>Saldo</div><h1>${msg}</h1><p class="mut">${sub}</p>${retry ? `<button class="hbtn" id="retry" style="margin-top:12px;color:var(--navy);border-color:var(--hair2)">${T().retry}</button>` : ""}</div>`; const b = $("#retry"); if (b) b.onclick = () => load(); }
async function load() {
  const btn = $("#refresh"); if (btn) btn.disabled = true;
  try {
    const res = await fetch(`${API}?k=${encodeURIComponent(S.key)}`, { cache:"no-store" });
    if (res.status===401) { try { localStorage.removeItem("saldo.k"); } catch {} return lockScreen(T().locked, T().lockedSub); }
    if (!res.ok) throw new Error(res.status);
    S.data = await res.json();
    if (!S.perChosen && S.per==="today" && !S.data.expenses.some(e => e.d===S.data.today)) { S.per = "yesterday"; S.autoNote = true; }
    if (S.foreman!=="all" && !S.data.foremen.some(f => f.name===S.foreman)) S.foreman = "all";
    shell();
    const op = S.openParam; if (op && !S.opened) { S.opened = 1; const [kind,a] = decodeURIComponent(op).split(":"); if (kind==="f") drawerForeman(a); else if (kind==="o") drawerObject(a); else if (kind==="c") drawerChecks(); }
  } catch (err) { if (!S.data) lockScreen(T().loadErr, String(err.message||err), true); else if (btn) btn.disabled = false; }
}
(function boot() {
  document.documentElement.lang = S.lang;
  const h = location.hash, m = h.match(/k=([^&]+)/), tb = h.match(/tab=(\d)/), pr = h.match(/per=(today|yesterday|w|m)/);
  if (tb && +tb[1] < 3) S.tab = +tb[1]; if (pr) { S.per = pr[1]; S.perChosen = true; } S.openParam = (h.match(/open=([^&]+)/) || [])[1];
  try { if (m) { localStorage.setItem("saldo.k", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search); } S.key = localStorage.getItem("saldo.k"); } catch { S.key = m ? decodeURIComponent(m[1]) : null; }
  if (!S.key) return lockScreen(T().locked, T().lockedSub);
  load();
  setInterval(() => { if (!document.hidden && S.data && !drawer.classList.contains("on")) load(); }, 5*60*1000);
})();
</script>
</body>
</html>
